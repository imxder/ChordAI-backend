sonar.organization=imxder
sonar.projectKey=imxder_ChordAI-backend
sonar.projectName=ChordAI-backend

# Código que o SonarCloud analisa. Os testes ficam separados, em sonar.tests.
sonar.sources=api,scripts,export,experiments,pipeline.py,train_model.py,baixar_dataset.py
sonar.tests=tests
sonar.python.version=3.12

# Resultados dos experimentos, candidatos antigos e modelos/áudios não são código.
sonar.exclusions=experiments/results*/**,experiments/candidates/**,**/*.h5,**/*.tflite,**/*.joblib,**/*.wav,export/*.json

# Gerado pelo pytest-cov no CI.
sonar.python.coverage.reportPaths=coverage.xml
