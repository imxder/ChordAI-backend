sonar.organization=imxder
sonar.projectKey=imxder_ChordAI-backend
sonar.projectName=ChordAI-backend

sonar.python.version=3.12

# O SonarCloud analisa o projeto inteiro (sonar.sources não tem mais efeito), então
# o que limita a análise são as exclusões: resultados dos experimentos, candidatos
# antigos, o modelo da API, os CSVs do dataset e os arquivos de modelo e áudio não
# são código.
sonar.exclusions=experiments/results*/**,experiments/candidates/**,trained_model/**,data/**,**/*.h5,**/*.tflite,**/*.joblib,**/*.wav,export/*.json

# Gerado pelo pytest-cov no CI.
sonar.python.coverage.reportPaths=coverage.xml
