# Roda os testes em todo push e em todo PR.
name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A mesma versão do Python dos resultados (README, seção "Instalar").
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Dependências
        run: pip install -r requirements.lock.txt

      # Os testes marcados com "dataset" precisam dos áudios em disco, que não
      # vão pro Git. O export TFLite tem um passo só dele, logo abaixo.
      - name: Testes
        run: python -m pytest -m "not dataset" -rs --ignore=tests/unit/test_export_tflite.py

      # Confere se o .tflite do export/ ainda dá as mesmas probabilidades do
      # example_expected.json, só usa operações nativas e bate com o model_info.json.
      - name: Export TFLite
        run: |
          test -f export/chord_model.tflite
          python -m pytest -rs tests/unit/test_export_tflite.py
