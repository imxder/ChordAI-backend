# Roda os testes em todo push e em todo PR.
name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    # 24.04 e nao ubuntu-latest: o Python 3.12.10 nao tem build pro Ubuntu 26.04
    # (versions-manifest.json do actions/python-versions).
    runs-on: ubuntu-24.04
    steps:
      # fetch-depth 0 traz o histórico todo, que o SonarCloud usa pra saber o que é
      # código novo e quem mexeu em cada linha.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A mesma versão do Python dos resultados (README, seção "Instalar").
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Dependências
        run: pip install -r requirements.lock.txt

      # Os testes marcados com "dataset" precisam dos áudios em disco, que não
      # vão pro Git. O export TFLite tem um passo só dele, logo abaixo.
      - name: Testes
        run: python -m pytest -m "not dataset" -rs --ignore=tests/unit/test_export_tflite.py --cov=. --cov-report=

      # Confere se o .tflite do export/ ainda dá as mesmas probabilidades do
      # example_expected.json, só usa operações nativas e bate com o model_info.json.
      - name: Export TFLite
        run: |
          test -f export/chord_model.tflite
          python -m pytest -rs tests/unit/test_export_tflite.py --cov=. --cov-append --cov-report=xml

      # Manda o código e o coverage.xml (das duas rodadas de teste) pro SonarCloud.
      # A configuração está no sonar-project.properties.
      - name: SonarCloud
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
